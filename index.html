<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reporte Operativo Mina</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">MineCAD · Control operativo</p>
      <h1>Reporte de turno</h1>
    </div>
    <div class="status-pill">Prototipo</div>
  </header>

  <main class="container">
    <section class="card setup-card">
      <h2>Datos del turno</h2>
      <div class="grid three">
        <label>
          Mina
          <select id="mina">
            <option value="">Seleccionar</option>
            <option>Mina 1</option>
            <option>Mina 2</option>
          </select>
        </label>
        <label>
          Fecha
          <input id="fecha" type="date" />
        </label>
        <label>
          Turno
          <select id="turno">
            <option value="">Seleccionar</option>
            <option>Primero</option>
            <option>Segundo</option>
            <option>Tercero</option>
          </select>
        </label>
      </div>
      <p id="setupWarning" class="warning hidden">Selecciona mina, fecha y turno antes de capturar información.</p>
    </section>

    <section class="module-grid">
      <button class="module-card" data-module="disparos">
        <span class="module-icon">01</span>
        <span>
          <strong>Obras disparadas</strong>
          <small>Cueles y tumbes realizados durante el turno.</small>
        </span>
      </button>

      <button class="module-card" data-module="equipos">
        <span class="module-icon">02</span>
        <span>
          <strong>Equipos diésel</strong>
          <small>Estado operativo y causas de paro.</small>
        </span>
      </button>

      <button class="module-card" data-module="acarreo">
        <span class="module-icon">03</span>
        <span>
          <strong>Acarreo mina → planta</strong>
          <small>Viajes y toneladas transportadas.</small>
        </span>
      </button>

      <button class="module-card" data-module="ausentismo">
        <span class="module-icon">04</span>
        <span>
          <strong>Ausentismo</strong>
          <small>Personal programado, presente y ausente.</small>
        </span>
      </button>
    </section>

    <section id="workspace" class="card workspace hidden">
      <div class="workspace-header">
        <div>
          <p class="eyebrow" id="workspaceContext"></p>
          <h2 id="workspaceTitle">Módulo</h2>
        </div>
        <button id="closeWorkspace" class="secondary">Cerrar</button>
      </div>
      <div id="workspaceBody"></div>
    </section>

    <section class="card summary-card">
      <div>
        <p class="eyebrow">Estado del reporte</p>
        <h2>Resumen de captura</h2>
      </div>
      <div class="summary-grid">
        <div><strong id="countDisparos">0</strong><span>Disparos</span></div>
        <div><strong id="countEquipos">0</strong><span>Equipos</span></div>
        <div><strong id="countAcarreo">0</strong><span>Registros acarreo</span></div>
        <div><strong id="countAusentismo">0</strong><span>Ausencias</span></div>
      </div>
      <button id="closeShift" class="primary full">Cerrar reporte de turno</button>
    </section>
  </main>

  <template id="tpl-disparos">
    <form class="entry-form" data-form="disparos">
      <div class="grid two">
        <label>Obra<input name="obra" required placeholder="Ej. NV 1450 Fte Norte" /></label>
        <label>Tipo<select name="tipo" required><option value="">Seleccionar</option><option>Cuele</option><option>Tumbe</option></select></label>
        <label>Metros estimados<input name="metros" type="number" step="0.01" min="0" placeholder="0.00" /></label>
        <label>Resultado<select name="resultado" required><option>Disparado</option><option>Parcial</option><option>Fallado</option><option>Pendiente</option></select></label>
      </div>
      <label>Observaciones<textarea name="observaciones" rows="3" placeholder="Opcional"></textarea></label>
      <button class="primary" type="submit">Agregar disparo</button>
    </form>
    <div class="records" data-records="disparos"></div>
  </template>

  <template id="tpl-equipos">
    <form class="entry-form" data-form="equipos">
      <div class="grid two">
        <label>Equipo<input name="equipo" required placeholder="Ej. Scoop 03" /></label>
        <label>Estado<select name="estado" required><option>Operativo</option><option>Falla mecánica</option><option>Falla eléctrica</option><option>Mantenimiento</option><option>Sin operador</option><option>Esperando refacción</option></select></label>
        <label>Horas trabajadas<input name="horas" type="number" step="0.1" min="0" max="24" placeholder="0.0" /></label>
        <label>Horómetro<input name="horometro" type="number" step="0.1" min="0" placeholder="Opcional" /></label>
      </div>
      <label>Observaciones<textarea name="observaciones" rows="3" placeholder="Causa, componente, hora de falla, etc."></textarea></label>
      <button class="primary" type="submit">Agregar equipo</button>
    </form>
    <div class="records" data-records="equipos"></div>
  </template>

  <template id="tpl-acarreo">
    <form class="entry-form" data-form="acarreo">
      <div class="grid two">
        <label>Camión / unidad<input name="unidad" required placeholder="Ej. Camión 05" /></label>
        <label>Viajes<input name="viajes" required type="number" min="0" step="1" placeholder="0" /></label>
        <label>Toneladas estimadas<input name="toneladas" type="number" min="0" step="0.01" placeholder="0.00" /></label>
        <label>Destino<input name="destino" value="Planta de beneficio" /></label>
      </div>
      <label>Observaciones<textarea name="observaciones" rows="3" placeholder="Opcional"></textarea></label>
      <button class="primary" type="submit">Agregar acarreo</button>
    </form>
    <div class="records" data-records="acarreo"></div>
  </template>

  <template id="tpl-ausentismo">
    <form class="entry-form" data-form="ausentismo">
      <div class="grid two">
        <label>Trabajador<input name="trabajador" required placeholder="Nombre o número de empleado" /></label>
        <label>Puesto<input name="puesto" required placeholder="Ej. Operador de scoop" /></label>
        <label>Motivo<select name="motivo" required><option>Falta</option><option>Incapacidad</option><option>Permiso</option><option>Vacaciones</option><option>Otro</option></select></label>
        <label>Observación<input name="observacion" placeholder="Opcional" /></label>
      </div>
      <button class="primary" type="submit">Registrar ausencia</button>
    </form>
    <div class="records" data-records="ausentismo"></div>
  </template>

  <script src="app.js"></script>
</body>
</html>
